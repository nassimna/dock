appId: dev.dock.desktop
productName: Rivnote
executableName: dock
directories:
  output: release
files:
  - out/**
  - resources/**
  - package.json
asar: true
linux:
  target: AppImage
  category: Office
  icon: resources/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/app-icon.icns
publish:
  provider: github
  owner: nassimna
  repo: dock
  releaseType: release
win:
  icon: resources/app-icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
